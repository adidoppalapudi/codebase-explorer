[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-explorer"
version = "0.1.0"
description = "Explore repositories with local text search, source citations, and MCP tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "pathspec>=0.12,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
structure = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.scripts]
explorer = "explorer.cli:main"
explorer-mcp = "explorer.mcp_server:main"

[tool.setuptools]
packages = ["explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
